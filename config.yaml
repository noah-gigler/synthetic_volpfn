# ssvi_prior
# --------------------------------------------------------------------------
v_bar:
  median: 0.04      # 20% ATM vol (historical SPX)
  sigma: 0.5        # 12-33% vol at 5th-95th pct

# v0 = v_bar * r
r:  
  median: 1.0       # on average v0 = v_bar
  sigma: 0.35       # 0.5, 2 at 5th-95th pct

kappa:
  median: 2.0         
  sigma: 0.7        # 0.5, 7 at 5th-95th pct

rho:
  median: 0.7       # -0.7 skew (historical SPX) listed as |rho| 
  sigma: 0.5        # -0.9, -0.4 at 5th-95th pct

gamma:
  median: 0.5       # typically 0.5 
  sigma: 0.5


# quote noise (bid/ask spread model, see src/data_generation/noise.py)
# --------------------------------------------------------------------------
noise:
  beta: 0.015         # proportional price half-spread component
  tick: 3.0e-4        # fixed price half-spread component per unit forward (widens wings)
  cap: 0.05           # max IV half-spread (5 vol pts) - liquidity-filter proxy
  regime_sigma: 0.5   # per-surface lognormal scale on the spread (calm vs stressed)
  jitter_sigma: 0.3   # per-quote lognormal jitter on the half-spread


# grid settings
# --------------------------------------------------------------------------
k:
  min: -0.5
  max: 0.5
  n_points: 25

ttm:
  min: 0.1
  max: 1.0
  n_points: 15
