# ssvi_prior
# --------------------------------------------------------------------------
v_bar:
  median: 0.04      # 20% ATM vol (historical SPX)
  sigma: 0.5        # 12-33% vol at 5th-95th pct

# v0 = v_bar * r
r:  
  median: 1.0       # on average v0 = v_bar
  sigma: 0.35       # 0.5, 2 at 5th-95th pct

kappa:
  median: 2.0         
  sigma: 0.7        # 0.5, 7 at 5th-95th pct

rho:
  median: 0.7       # -0.7 skew (historical SPX) listed as |rho| 
  sigma: 0.5        # -0.9, -0.4 at 5th-95th pct

gamma:
  median: 0.5       # typically 0.5 
  sigma: 0.5


# quote noise (bid/ask spread model, see src/data_generation/noise.py)
# --------------------------------------------------------------------------
noise:
  # calibrated to SPXW 2020-2023 (1001 days) - see notes/results_summary.md. The previous
  # values made every synthetic quote ~7x looser than the market's, and drove half the grid
  # into `cap`. Fitted on the ATM-Gaussian-weighted distribution the sampler actually draws
  # from, not pooled over the grid: beta sets the ATM width (vega large -> price term rules),
  # tick sets the wings (vega small -> tick term rules), so a pooled fit over-weights wings
  # nobody samples and leaves ATM ~30% too wide.
  beta: 0.005         # market maker half spread (0.5%)
  tick: 2.0e-5        # minimum half spread ($0.05 tick on SPX ~4500; the old 3.0e-4 assumed a $150 underlying)
  cap: 0.05           # max IV half-spread (liquidity-filter proxy; no longer binds on real data post-calibration)
  regime_sigma: 0.5   # per-surface lognormal scale on the spread; regime=1 is the median SPXW day,
                      # regime=2 the ~95th percentile. Kept wide (real log-sd is 0.36) for stress coverage
  jitter_sigma: 0.4   # pointwise independent scaling; real SPXW noise is mostly PER-QUOTE
                      # (between/within log-sd 0.28/0.43), not per-surface - cf. the rho ablation

# pre-calibration constants, frozen for backward comparison against every run predating the
# SPXW calibration above - select with `--legacy-noise` (see scripts/run_finetuning.py). Not
# used by default; kept only so old and new results stay reproducible side by side.
noise_legacy:
  beta: 0.015
  tick: 3.0e-4
  cap: 0.05
  regime_sigma: 0.5
  jitter_sigma: 0.3


# output bar distribution
# --------------------------------------------------------------------------
# upper border of the fixed positive bar distribution; covers in-domain real+synthetic
# IV (max ~1.3) with margin, lower border is 0 (IV > 0 is a hard floor)
iv_max: 1.5
# global z-score for the bar distribution's target space (mean/std of raw IV). synthetic:
# 200k SSVI surfaces. real: SPXW train-pool only (2020-01-01 to val_months/test_months before
# 2023-12-31, temporal_split defaults) - narrower than synthetic (real quotes concentrate near
# short maturities/ATM, see z/tau stats below), so kept separate rather than blended.
y_mean: 0.300
y_scale: 0.135
y_mean_real: 0.275
y_scale_real: 0.120

# global z-score for input features z, tau (optional - off by default, features are fed raw).
# same synthetic/real split as above and for the same reason: real quotes cluster in a
# narrower, shifted sub-region (short tau, near-ATM z) of the domain synthetic samples
# ~uniformly across.
z_mean: -0.500
z_scale: 0.601
z_mean_real: -0.225
z_scale_real: 0.407
tau_mean: 0.396
tau_scale: 0.309
tau_mean_real: 0.192
tau_scale_real: 0.177

# robust global squashing: median-center + IQR-scale (no clip - z/tau are already hard-bounded
# by the domain limits below, so a +-3 clip would never activate). Same synthetic/real split as
# above. Real IV has fatter tails relative to its own IQR than synthetic (std/IQR: 0.82 vs 0.72
# vs a normal-distribution reference of 0.74) - mean/std is more outlier-sensitive than
# median/IQR, so this may matter more for real.
y_median: 0.275
y_iqr: 0.187
y_median_real: 0.251
y_iqr_real: 0.144
z_median: -0.500
z_iqr: 1.000
z_median_real: -0.150
z_iqr_real: 0.509
tau_median: 0.326
tau_iqr: 0.560
tau_median_real: 0.129
tau_iqr_real: 0.219


# mixture
# --------------------------------------------------------------------------
# fraction of generate_surfaces' output drawn from Heston instead of SSVI. 0.0 (default if
# absent) = pure SSVI, matching every experiment run before this existed. Opt in per-run by
# setting this > 0; every existing caller (noise.py's clean/noisy/eval-set builders) goes
# through generate_surfaces with no extra args, so this is the only thing that needs changing.
mixture:
  heston_frac: 0.0


# heston_prior (second synthetic surface family, mixed with SSVI - see heston.py)
# --------------------------------------------------------------------------
# v0/kappa/theta/rho are NOT sampled here - heston.sample_params reuses SSVI's own
# v_bar/r/kappa/rho prior above directly (already historically-calibrated-to-SPX Heston-style
# parameters; SSVI's `thetas` term structure IS the Heston mean-reverting-variance formula).
# sigma (vol-of-vol) is the only parameter with no SSVI analogue - uniform, not lognormal like
# the rest of the SSVI prior (kept simple; this range already brackets realistic equity-index
# vol-of-vol).
heston_prior:
  sigma: {min: 0.1, max: 1.0}


# grid settings
# --------------------------------------------------------------------------
# z = k/√τ
# Range is taken from OpDS (96.6% of volume on their data)
# TODO: recallibrate this for our data

z:
  min: -1.5
  max: 0.5
  n_points: 25

ttm:
  min: 0.02        # ~1 week short end
  max: 1.0
  n_points: 15
