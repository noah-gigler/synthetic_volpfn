# ssvi_prior
# --------------------------------------------------------------------------
v_bar:
  median: 0.04      # 20% ATM vol (historical SPX)
  sigma: 0.5        # 12-33% vol at 5th-95th pct

# v0 = v_bar * r
r:  
  median: 1.0       # on average v0 = v_bar
  sigma: 0.35       # 0.5, 2 at 5th-95th pct

kappa:
  median: 2.0         
  sigma: 0.7        # 0.5, 7 at 5th-95th pct

rho:
  median: 0.7       # -0.7 skew (historical SPX) listed as |rho| 
  sigma: 0.5        # -0.9, -0.4 at 5th-95th pct

gamma:
  median: 0.5       # typically 0.5 
  sigma: 0.5


# quote noise (bid/ask spread model, see src/data_generation/noise.py)
# --------------------------------------------------------------------------
noise:
  beta: 0.015         # market maker half spread (1.5%)
  tick: 3.0e-4        # minimum half spread ($0.05 tick on a $150 stock -> 3.0e-4)
  cap: 0.05           # max IV half-spread (liquidity-filter proxy; stops wings from having infinite spread)
  regime_sigma: 0.5   # per-surface lognormal scale on the spread 
  jitter_sigma: 0.3   # pointwise indepentent scaling to prevent inversion


# output bar distribution
# --------------------------------------------------------------------------
# upper border of the fixed positive bar distribution; covers in-domain real+synthetic
# IV (max ~1.3) with margin, lower border is 0 (IV > 0 is a hard floor)
iv_max: 1.5
# global z-score for the bar distribution's target space (mean/std of raw IV, synthetic + real)
y_mean: 0.300
y_scale: 0.135


# grid settings
# --------------------------------------------------------------------------
# z = k/√τ
# Range is taken from OpDS (96.6% of volume on their data)
# TODO: recallibrate this for our data

z:
  min: -1.5
  max: 0.5
  n_points: 25

ttm:
  min: 0.02        # ~1 week short end
  max: 1.0
  n_points: 15
